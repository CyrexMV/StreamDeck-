<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="TabDeck – dein Tablet als Stream Deck für den PC">
  <title>TabDeck</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header id="topbar">
    <nav id="tabs" aria-label="Seiten"></nav>
    <div class="top-actions">
      <span id="status" class="status" title="Nicht verbunden"></span>
      <button id="btn-edit" class="icon-btn" title="Tasten bearbeiten" aria-label="Tasten bearbeiten"></button>
      <button id="btn-settings" class="icon-btn" title="Einstellungen" aria-label="Einstellungen"></button>
      <button id="btn-fullscreen" class="icon-btn" title="Vollbild" aria-label="Vollbild"></button>
    </div>
  </header>
  <div id="edithint" hidden>
    <span>Bearbeiten: Taste antippen zum Ändern – festhalten und ziehen zum Verschieben.</span>
    <button id="btn-mixer-setup" class="btn small" hidden>🎚️ Mixer einrichten</button>
    <button id="btn-done" class="btn primary small">Fertig</button>
  </div>
  <main id="deck"><div id="grid"></div></main>
  <div id="toasts" aria-live="polite"></div>
  <script src="/web/app.js"></script>
</body>
</html>
